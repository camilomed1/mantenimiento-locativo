# Serves the PWA and proxies /api to the backend (same origin: no CORS, and
# the token never leaves the page origin).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The service worker and the shell must always be revalidated, or phones
    # would keep an old version forever.
    location = /sw.js         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Compressed photos are ~300 KB; the API limit is 2 MB.
        client_max_body_size 3m;
        # Server-Sent Events: no buffering, long-lived connection.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Single-page app: every other route serves the shell.
    location / {
        try_files $uri /index.html;
    }
}
